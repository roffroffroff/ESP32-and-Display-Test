; ESP32 load-cell transmitter with local SSD1306 OLED and Bluetooth link.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -D LOAD_CELL_UNIT=1
lib_deps =
    h2zero/NimBLE-Arduino@2.3.2
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@^1.0.6
    adafruit/Adafruit SSD1306
monitor_speed = 115200

; Upload this environment to the second load-cell ESP32.
[env:load_cell_2]
extends = env:esp32dev
build_flags =
    -D LOAD_CELL_UNIT=2
